name: MarketX Market Session
# MarketX scheduled market-session bridge

on:
  schedule:
    # Three independent weekday starts.
    # 09:00 IST = 03:30 UTC
    # 14:50 IST = 09:20 UTC
    # 20:40 IST = 15:10 UTC
    - cron: "30 3 * * 1-5"
    - cron: "20 9 * * 1-5"
    - cron: "10 15 * * 1-5"
  workflow_dispatch:
    inputs:
      phase:
        description: Session phase (1=09:00-14:50 IST, 2=14:50-20:40 IST, 3=20:40-23:50 IST)
        required: false
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
      symbol:
        description: Trade99 symbol
        required: false
        default: "CRUDEOIL26SEPFUT"
        type: string

permissions:
  actions: write
  contents: read

jobs:
  market_session:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      MARKETX_SYMBOL: ${{ inputs.symbol || 'CRUDEOIL26SEPFUT' }}
      MARKETX_TRADE99_URL: https://trade99.live:3000
      SUPABASE_URL: https://ynluiynxwnuubxcmxude.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      MARKETX_BATCH_SIZE: "50"
      MARKETX_FLUSH_SECONDS: "0.5"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate secret
        run: |
          test -n "$SUPABASE_SECRET_KEY" || {
            echo "SUPABASE_SECRET_KEY is not configured in repository secrets."
            exit 1
          }

      - name: Run MarketX bridge under watchdog supervisor
        env:
          REQUESTED_PHASE: ${{ inputs.phase }}
        run: |
          python - <<'PY'
          import os
          import signal
          import subprocess
          import time
          from datetime import datetime, timezone

          requested = os.environ.get("REQUESTED_PHASE", "").strip()
          now = datetime.now(timezone.utc)

          if requested in {"1", "2", "3"}:
              phase = requested
          else:
              minutes = now.hour * 60 + now.minute
              if 3 * 60 + 30 <= minutes < 9 * 60 + 20:
                  phase = "1"
              elif 9 * 60 + 20 <= minutes < 15 * 60 + 10:
                  phase = "2"
              elif 15 * 60 + 10 <= minutes < 18 * 60 + 20:
                  phase = "3"
              else:
                  print(f"Outside scheduled market session: {now.isoformat()}")
                  raise SystemExit(0)

          targets = {"1": (9, 20), "2": (15, 10), "3": (18, 20)}
          target_hour, target_minute = targets[phase]
          target = now.replace(hour=target_hour, minute=target_minute, second=0, microsecond=0)
          end_time = max(now, target)

          log = open("marketx-session.log", "a", buffering=1)
          restarts = 0
          child = None
          stream_threads = []

          def stream_bridge_output(proc):
              try:
                  for line in iter(proc.stdout.readline, ""):
                      print(f"MARKETX BRIDGE | {line}", end="", flush=True)
                      log.write(line)
                      log.flush()
              finally:
                  try:
                      proc.stdout.close()
                  except Exception:
                      pass

          def start_bridge():
              global restarts
              restarts += 1
              print(f"MARKETX WATCHDOG | starting bridge | restart_count={restarts}", flush=True)
              proc = subprocess.Popen(
                  ["python", "-u", "marketx_tick_bridge.py"],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
                  bufsize=1,
                  start_new_session=True,
              )
              import threading
              thread = threading.Thread(target=stream_bridge_output, args=(proc,), daemon=True)
              thread.start()
              stream_threads.append(thread)
              return proc

          def stop_bridge():
              if child is None or child.poll() is not None:
                  return
              try:
                  os.killpg(child.pid, signal.SIGTERM)
                  child.wait(timeout=10)
              except Exception:
                  try:
                      os.killpg(child.pid, signal.SIGKILL)
                  except Exception:
                      pass

          print(
              f"MARKETX WATCHDOG | phase={phase} | "
              f"start={now.isoformat()} stop={end_time.isoformat()}",
              flush=True,
          )

          try:
              child = start_bridge()
              while datetime.now(timezone.utc) < end_time:
                  code = child.poll()
                  if code is not None:
                      print(
                          f"MARKETX WATCHDOG | BRIDGE EXITED code={code} | restarting in 5 sec",
                          flush=True,
                      )
                      time.sleep(5)
                      if datetime.now(timezone.utc) >= end_time:
                          break
                      child = start_bridge()
                  else:
                      time.sleep(5)
          finally:
              stop_bridge()
              for thread in stream_threads:
                  thread.join(timeout=2)
              log.close()
              print("MARKETX WATCHDOG | session ended", flush=True)
          PY

      - name: Show MarketX session log
        if: always()
        run: |
          tail -n 200 marketx-session.log 2>/dev/null || true

      - name: Stop MarketX bridge
        if: always()
        run: |
          if [ -f marketx-session.pid ]; then
            kill "$(cat marketx-session.pid)" 2>/dev/null || true
          fi
          tail -n 100 marketx-session.log 2>/dev/null || true
