name: MarketX Market Session
# MarketX 6-hour rotating market-session bridge
#
# Each scheduled run gets its own fresh GitHub-hosted runner.
# The bridge itself is supervised inside the job and restarts if the child
# process exits. The job is intentionally allowed to run close to GitHub's
# 6-hour hosted-runner limit so a late scheduled start does not shorten the
# session because of a fixed market-phase end time.

on:
  schedule:
    # 09:00 IST = 03:30 UTC
    # 15:00 IST = 09:30 UTC
    # 21:00 IST = 15:30 UTC
    #
    # Each run is independent and is allowed to run for up to ~5h55m.
    # The 21:00 run therefore continues into the next UTC day until the
    # GitHub runner limit, while the next weekday 09:00 run starts fresh.
    - cron: "30 3 * * 1-5"
    - cron: "30 9 * * 1-5"
    - cron: "30 15 * * 1-5"
  workflow_dispatch:
    inputs:
      phase:
        description: Manual session slot (1=09:00 IST, 2=15:00 IST, 3=21:00 IST)
        required: false
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
      symbol:
        description: Trade99 symbol
        required: false
        default: "CRUDEOIL26OCTFUT"
        type: string

permissions:
  actions: write
  contents: read

jobs:
  market_session:
    runs-on: ubuntu-latest
    # GitHub-hosted runner maximum is 6 hours. Keep a small safety margin.
    timeout-minutes: 355
    env:
      MARKETX_SYMBOL: ${{ inputs.symbol || 'CRUDEOIL26OCTFUT' }}
      MARKETX_TRADE99_URL: https://trade99.live:3000
      SUPABASE_URL: https://ynluiynxwnuubxcmxude.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      MARKETX_BATCH_SIZE: "50"
      MARKETX_FLUSH_SECONDS: "0.5"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate secret
        run: |
          test -n "$SUPABASE_SECRET_KEY" || {
            echo "SUPABASE_SECRET_KEY is not configured in repository secrets."
            exit 1
          }

      - name: Test Supabase API authentication
        run: |
          python - <<'PY'
          import os
          import requests

          key = os.environ["SUPABASE_SECRET_KEY"].strip()
          url = os.environ["SUPABASE_URL"].rstrip("/") + "/rest/v1/market_snapshots"
          r = requests.get(
              url,
              params={"select": "id", "limit": "1"},
              headers={"apikey": key},
              timeout=15,
          )
          print(f"SUPABASE AUTH CHECK | HTTP {r.status_code} | KEY TYPE={'sb_secret' if key.startswith('sb_secret_') else 'legacy_or_other'} | KEY LENGTH={len(key)}")
          if r.status_code != 200:
              print("SUPABASE AUTH CHECK BODY:", r.text[:500])
              raise SystemExit("Supabase API authentication failed.")
          print("SUPABASE AUTH CHECK: OK")
          PY

      - name: Run MarketX bridge under watchdog supervisor
        env:
          REQUESTED_PHASE: ${{ inputs.phase }}
        run: |
          python - <<'PY'
          import os
          import signal
          import subprocess
          import time
          from datetime import datetime, timezone

          requested = os.environ.get("REQUESTED_PHASE", "").strip()
          now = datetime.now(timezone.utc)

          # Manual phase selection is only a label for the log. The bridge
          # session duration is always based on the actual job start time.
          phase = requested if requested in {"1", "2", "3"} else "auto"

          # Do not calculate a fixed market-clock end time here.
          # The GitHub job timeout is the session boundary. This is the key
          # change that prevents a late scheduled start from ending early.
          session_seconds = 355 * 60
          end_time = now.timestamp() + session_seconds

          log = open("marketx-session.log", "a", buffering=1)
          restarts = 0
          child = None
          stream_threads = []

          def stream_bridge_output(proc):
              try:
                  for line in iter(proc.stdout.readline, ""):
                      print(f"MARKETX BRIDGE | {line}", end="", flush=True)
                      log.write(line)
                      log.flush()
              finally:
                  try:
                      proc.stdout.close()
                  except Exception:
                      pass

          def start_bridge():
              global restarts
              restarts += 1
              print(
                  f"MARKETX WATCHDOG | starting bridge | restart_count={restarts}",
                  flush=True,
              )
              proc = subprocess.Popen(
                  ["python", "-u", "marketx_tick_bridge.py"],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
                  bufsize=1,
                  start_new_session=True,
              )
              import threading
              thread = threading.Thread(
                  target=stream_bridge_output,
                  args=(proc,),
                  daemon=True,
              )
              thread.start()
              stream_threads.append(thread)
              return proc

          def stop_bridge():
              if child is None or child.poll() is not None:
                  return
              try:
                  os.killpg(child.pid, signal.SIGTERM)
                  child.wait(timeout=10)
              except Exception:
                  try:
                      os.killpg(child.pid, signal.SIGKILL)
                  except Exception:
                      pass

          print(
              f"MARKETX WATCHDOG | phase={phase} | "
              f"start={now.isoformat()} | "
              f"planned_session_minutes=355 | "
              f"planned_stop={datetime.fromtimestamp(end_time, timezone.utc).isoformat()}",
              flush=True,
          )

          try:
              child = start_bridge()

              while time.time() < end_time:
                  code = child.poll()
                  if code is not None:
                      print(
                          f"MARKETX WATCHDOG | BRIDGE EXITED code={code} | "
                          f"restarting in 5 sec",
                          flush=True,
                      )
                      time.sleep(5)
                      if time.time() >= end_time:
                          break
                      child = start_bridge()
                  else:
                      time.sleep(5)

          finally:
              stop_bridge()
              for thread in stream_threads:
                  thread.join(timeout=2)
              log.close()
              print("MARKETX WATCHDOG | session ended", flush=True)
          PY

      - name: Show MarketX session log
        if: always()
        run: |
          tail -n 200 marketx-session.log 2>/dev/null || true

      - name: Stop MarketX bridge
        if: always()
        run: |
          if [ -f marketx-session.pid ]; then
            kill "$(cat marketx-session.pid)" 2>/dev/null || true
          fi
          tail -n 100 marketx-session.log 2>/dev/null || true
