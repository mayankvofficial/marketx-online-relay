name: MarketX Market Session
# MarketX market-session bridge
#
# The bridge has NO self-imposed time-based stop.
# It keeps running and reconnecting/restarting its child until the
# GitHub-hosted runner itself ends the job.

on:
  schedule:
    # 08:55 IST = 03:25 UTC
    # 14:50 IST = 09:20 UTC
    # 20:50 IST = 15:20 UTC
    - cron: "25 3 * * 1-5"
    - cron: "20 9 * * 1-5"
    - cron: "20 15 * * 1-5"
  workflow_dispatch:
    inputs:
      phase:
        description: Manual session slot (1=08:55 IST, 2=14:50 IST, 3=20:50 IST)
        required: false
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
      symbol:
        description: Trade99 symbol
        required: false
        default: "CRUDEOIL26OCTFUT"
        type: string

permissions:
  actions: write
  contents: read

jobs:
  market_session:
    runs-on: ubuntu-latest
    # Use the full GitHub-hosted job timeout. There is no shorter
    # MarketX-imposed session timer.
    timeout-minutes: 360
    env:
      MARKETX_SYMBOL: ${{ inputs.symbol || 'CRUDEOIL26OCTFUT' }}
      MARKETX_TRADE99_URL: https://trade99.live:3000
      SUPABASE_URL: https://ynluiynxwnuubxcmxude.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      MARKETX_BATCH_SIZE: "50"
      MARKETX_FLUSH_SECONDS: "0.5"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate secret
        run: |
          test -n "$SUPABASE_SECRET_KEY" || {
            echo "SUPABASE_SECRET_KEY is not configured in repository secrets."
            exit 1
          }

      - name: Test Supabase API authentication
        run: |
          python - <<'PY'
          import os
          import requests

          key = os.environ["SUPABASE_SECRET_KEY"].strip()
          url = os.environ["SUPABASE_URL"].rstrip("/") + "/rest/v1/market_snapshots"
          r = requests.get(
              url,
              params={"select": "id", "limit": "1"},
              headers={"apikey": key},
              timeout=15,
          )
          print(f"SUPABASE AUTH CHECK | HTTP {r.status_code} | KEY TYPE={'sb_secret' if key.startswith('sb_secret_') else 'legacy_or_other'} | KEY LENGTH={len(key)}")
          if r.status_code != 200:
              print("SUPABASE AUTH CHECK BODY:", r.text[:500])
              raise SystemExit("Supabase API authentication failed.")
          print("SUPABASE AUTH CHECK: OK")
          PY

      - name: Run MarketX bridge under watchdog supervisor
        env:
          REQUESTED_PHASE: ${{ inputs.phase }}
        run: |
          python - <<'PY'
          import os
          import signal
          import subprocess
          import time
          from datetime import datetime, timezone

          requested = os.environ.get("REQUESTED_PHASE", "").strip()
          now = datetime.now(timezone.utc)

          # Manual phase selection is only a label for the log.
          phase = requested if requested in {"1", "2", "3"} else "auto"

          log = open("marketx-session.log", "a", buffering=1)
          restarts = 0
          child = None
          stream_threads = []

          def stream_bridge_output(proc):
              try:
                  for line in iter(proc.stdout.readline, ""):
                      print(f"MARKETX BRIDGE | {line}", end="", flush=True)
                      log.write(line)
                      log.flush()
              finally:
                  try:
                      proc.stdout.close()
                  except Exception:
                      pass

          def start_bridge():
              global restarts
              restarts += 1
              print(
                  f"MARKETX WATCHDOG | starting bridge | restart_count={restarts}",
                  flush=True,
              )
              proc = subprocess.Popen(
                  ["python", "-u", "marketx_tick_bridge.py"],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
                  bufsize=1,
                  start_new_session=True,
              )
              import threading
              thread = threading.Thread(
                  target=stream_bridge_output,
                  args=(proc,),
                  daemon=True,
              )
              thread.start()
              stream_threads.append(thread)
              return proc

          def stop_bridge():
              if child is None or child.poll() is not None:
                  return
              try:
                  print("MARKETX WATCHDOG | stopping bridge cleanly", flush=True)
                  os.killpg(child.pid, signal.SIGTERM)
                  child.wait(timeout=10)
              except Exception:
                  try:
                      os.killpg(child.pid, signal.SIGKILL)
                  except Exception:
                      pass

          print(
              f"MARKETX WATCHDOG | phase={phase} | "
              f"start={now.isoformat()} | "
              f"self_imposed_stop=DISABLED",
              flush=True,
          )

          try:
              child = start_bridge()

              # No elapsed-time/session-end condition here.
              # Keep the bridge alive until GitHub terminates the job
              # or the bridge process exits and is restarted.
              while True:
                  code = child.poll()
                  if code is not None:
                      print(
                          f"MARKETX WATCHDOG | BRIDGE EXITED code={code} | "
                          f"restarting in 5 sec",
                          flush=True,
                      )
                      time.sleep(5)
                      child = start_bridge()
                  else:
                      time.sleep(5)

          finally:
              # Cleanup only when the GitHub job itself is being terminated.
              # This is NOT a scheduled/session-time stop.
              stop_bridge()
              for thread in stream_threads:
                  thread.join(timeout=2)
              log.close()
              print("MARKETX WATCHDOG | process cleanup complete", flush=True)
          PY

      - name: Show MarketX session log
        if: always()
        run: |
          tail -n 200 marketx-session.log 2>/dev/null || true
